<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #020617; color: white; font-family: monospace; padding: 10px; }
  .row { display: flex; gap: 10px; margin: 10px 0; align-items: flex-start; }
  .asset { border: 1px solid #555; padding: 4px; }
  label { display: block; color: #0ff; font-size: 11px; margin-bottom: 4px; }
  canvas { border: 1px solid #f00; display: block; }
</style>
</head>
<body>
  <div class="asset"><label>frog-pano.png full (2500×640) — scaled to fit</label>
    <img src="/frog-pano.png" style="max-width:100%;display:block;"></div>

  <div id="slices"></div>

  <script>
    const img = new Image();
    img.src = '/frog-pano.png';
    img.onload = () => {
      const container = document.getElementById('slices');
      // Try multiple srcY values to find the clean branch zone
      [260, 290, 320, 350, 380, 410, 440].forEach(srcY => {
        const div = document.createElement('div');
        div.className = 'asset';
        div.innerHTML = `<label>srcY=${srcY}, srcH=60, srcX=0, srcW=500</label>`;
        const c = document.createElement('canvas');
        c.width = 1000; c.height = 60;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, srcY, 500, 60, 0, 0, 1000, 60);
        div.appendChild(c);
        container.appendChild(div);
      });
    };
  </script>
</body>
</html>
